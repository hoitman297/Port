<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://spoqa.github.io/spoqa-han-sans/css/SpoqaHanSansNeo.css" rel="stylesheet" type="text/css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: inherit; text-decoration: none; }
  </style>
</helmet>

<div style="min-height:100vh; background:{{bg}}; color:{{fg}}; font-family:'Spoqa Han Sans Neo', -apple-system, sans-serif; transition: background 0.4s ease, color 0.4s ease;">

  <div style="max-width:1120px; margin:0 auto; padding:36px 40px 0; display:flex; justify-content:space-between; align-items:center;">
    <a href="#" style="display:inline-flex; align-items:center; gap:8px; white-space:nowrap; font-family:'Space Mono',monospace; font-size:13px; color:{{fgMuted}}; transition: transform 0.3s ease, color 0.3s ease;" style-hover="transform:translateX(-4px); color:{{fg}};">
      <span>←</span> 뒤로가기
    </a>
    <button onClick="{{toggleTheme}}" style="all:unset; cursor:pointer; display:flex; align-items:center; gap:8px; padding:7px 14px; border-radius:999px; border:1px solid {{border}}; font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.02em; color:{{fgMuted}};">
      <span style="width:7px; height:7px; border-radius:50%; background:{{accent}}; display:inline-block;"></span>
      {{themeLabel}}
    </button>
  </div>

  <section style="max-width:720px; margin:0 auto; padding:56px 40px 8px;">
    <div style="font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.1em; color:{{accent}}; margin-bottom:16px;">ABOUT</div>
    <h1 style="margin:0 0 20px; font-size:clamp(30px,4vw,44px); font-weight:700; letter-spacing:-0.01em; line-height:1.15;">{{name}}</h1>
    <p style="margin:0; font-size:16px; line-height:1.75; color:{{fgMuted}};">{{introText}}</p>
  </section>

  <section style="max-width:720px; margin:0 auto; padding:56px 40px 0;">
    <h2 style="margin:0 0 24px; font-family:'Space Mono',monospace; font-size:13px; font-weight:700; letter-spacing:0.12em; color:{{fgMuted}}; padding-bottom:16px; border-bottom:1px solid {{border}};">EXPERIENCE</h2>
    <sc-for list="{{experience}}" as="item" hint-placeholder-count="2">
      <div style="display:grid; grid-template-columns:150px 1fr; gap:20px; padding:20px 0; border-bottom:1px solid {{border}};">
        <div style="font-family:'Space Mono',monospace; font-size:12.5px; color:{{fgMuted}};">{{item.period}}</div>
        <div>
          <div style="font-size:15.5px; font-weight:700; margin-bottom:4px;">{{item.title}}</div>
          <div style="font-size:14px; color:{{fgMuted}}; margin-bottom:8px;">{{item.org}}</div>
          <p style="margin:0; font-size:14px; line-height:1.65; color:{{fg}};">{{item.desc}}</p>
        </div>
      </div>
    </sc-for>
  </section>

  <section style="max-width:720px; margin:0 auto; padding:56px 40px 0;">
    <h2 style="margin:0 0 24px; font-family:'Space Mono',monospace; font-size:13px; font-weight:700; letter-spacing:0.12em; color:{{fgMuted}}; padding-bottom:16px; border-bottom:1px solid {{border}};">EDUCATION</h2>
    <sc-for list="{{education}}" as="item" hint-placeholder-count="1">
      <div style="display:grid; grid-template-columns:150px 1fr; gap:20px; padding:20px 0; border-bottom:1px solid {{border}};">
        <div style="font-family:'Space Mono',monospace; font-size:12.5px; color:{{fgMuted}};">{{item.period}}</div>
        <div>
          <div style="font-size:15.5px; font-weight:700; margin-bottom:4px;">{{item.title}}</div>
          <div style="font-size:14px; color:{{fgMuted}};">{{item.org}}</div>
        </div>
      </div>
    </sc-for>
  </section>

  <section style="max-width:720px; margin:0 auto; padding:56px 40px 120px;">
    <h2 style="margin:0 0 24px; font-family:'Space Mono',monospace; font-size:13px; font-weight:700; letter-spacing:0.12em; color:{{fgMuted}}; padding-bottom:16px; border-bottom:1px solid {{border}};">CONTACT</h2>
    <div style="display:flex; flex-direction:column; gap:2px;">
      <sc-for list="{{contacts}}" as="c" hint-placeholder-count="3">
        <a href="{{c.href}}" style="display:flex; align-items:center; justify-content:space-between; padding:16px 4px; border-bottom:1px solid {{border}}; transition:padding-left 0.25s ease, color 0.25s ease;" style-hover="padding-left:10px; color:{{accent}};">
          <span style="font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.06em; color:{{fgMuted}};">{{c.label}}</span>
          <span style="font-size:15px;">{{c.value}}</span>
        </a>
      </sc-for>
    </div>
  </section>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;defaultTheme&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;light&quot;, &quot;options&quot;: [&quot;light&quot;, &quot;dark&quot;], &quot;tsType&quot;: &quot;'light' | 'dark'&quot;, &quot;section&quot;: &quot;Behavior&quot; }
}">
class Component extends DCLogic {
  state = {
    theme: this.props.defaultTheme === 'dark' ? 'dark' : 'light',
  };

  toggleTheme = () => {
    this.setState((s) => ({ theme: s.theme === 'dark' ? 'light' : 'dark' }));
  };

  renderVals() {
    const isDark = this.state.theme === 'dark';

    const palette = isDark ? {
      bg: 'oklch(0.17 0.006 300)',
      fg: 'oklch(0.95 0.004 300)',
      fgMuted: 'oklch(0.66 0.012 300)',
      cardBg: 'oklch(0.215 0.008 300)',
      border: 'oklch(0.32 0.012 300)',
      accent: 'oklch(0.74 0.14 300)',
      chipBg: 'oklch(0.26 0.01 300)',
    } : {
      bg: 'oklch(0.985 0.003 300)',
      fg: 'oklch(0.2 0.01 300)',
      fgMuted: 'oklch(0.48 0.012 300)',
      cardBg: 'oklch(1 0 0)',
      border: 'oklch(0.885 0.006 300)',
      accent: 'oklch(0.52 0.16 300)',
      chipBg: 'oklch(0.955 0.004 300)',
    };

    return {
      bg: palette.bg,
      fg: palette.fg,
      fgMuted: palette.fgMuted,
      cardBg: palette.cardBg,
      border: palette.border,
      accent: palette.accent,
      chipBg: palette.chipBg,
      toggleTheme: this.toggleTheme,
      themeLabel: isDark ? 'Dark' : 'Light',
      name: '홍길동',
      introText: 'Spring Boot와 React 사이를 오가며, 기능 단위로 문제를 정의하고 해결하는 개발자입니다. 방문자용 화면과 관리자용 화면을 나누고, 직접 유지보수할 수 있는 구조를 만드는 데 관심이 있습니다.',
      experience: [
        {
          period: '2025 — 현재',
          title: '백엔드 개발자',
          org: '회사명',
          desc: '경력 내용이 이 자리에 들어갑니다.',
        },
      ],
      education: [
        {
          period: '2019 — 2025',
          title: '컴퓨터공학과 학사',
          org: '학교명',
        },
      ],
      contacts: [
        { label: 'EMAIL', value: 'hello@example.com', href: 'mailto:hello@example.com' },
        { label: 'GITHUB', value: 'github.com/username', href: '#' },
        { label: 'LINKEDIN', value: 'linkedin.com/in/username', href: '#' },
      ],
    };
  }
}
</script>
</body>
</html>
