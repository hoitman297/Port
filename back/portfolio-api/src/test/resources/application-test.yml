spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

jwt:
  secret: test-jwt-secret-value-that-is-long-enough-for-hmac-sha256-signing
  access-token-expiration-ms: 3600000

storage:
  provider: s3
  bucket: test-bucket
  region: ap-northeast-2
  access-key: test-access-key
  secret-key: test-secret-key
  endpoint:
  public-base-url: https://test.example.com
