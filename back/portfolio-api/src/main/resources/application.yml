spring:
  application:
    name: portfolio-api
  profiles:
    active: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8090

spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 10MB

cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:5173
